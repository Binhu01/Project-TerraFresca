<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Fresca — Offline</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }
        .offline-title {
            font-size: 1.5rem;
            color: var(--forest);
            margin-bottom: 0.5rem;
        }
        .offline-message {
            color: #666;
            max-width: 400px;
            line-height: 1.6;
        }
        .offline-retry {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🌿</div>
        <h1 class="offline-title">Você está offline</h1>
        <p class="offline-message">
            Não foi possível conectar à Terra Fresca.
            Verifique sua conexão com a internet e tente novamente.
            Seus dados salvos estarão disponíveis quando você voltar online.
        </p>
        <button class="btn offline-retry" onclick="window.location.reload()">
            Tentar novamente
        </button>
    </div>
</body>
</html>
