<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./styles/output.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>

    <title>BotaniCare — Cardápio | Terra Fresca</title>

    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">

    <meta name="description" content="Cosméticos naturais e sustentáveis da BotaniCare — cuidado com você e com o planeta.">
    <meta property="og:title" content="BotaniCare — Cardápio | Terra Fresca">
    <meta property="og:description" content="Cosméticos naturais e sustentáveis da BotaniCare — cuidado com você e com o planeta.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="../img/assentamento 2.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body class="font-sans text-ink bg-cream" data-loja="botanicare">
     <!-- Header -->
    <header class="relative w-full min-h-[440px] overflow-hidden bg-forest border-b-[6px] border-honey">
        <div class="absolute inset-0 header-photo header-botanicare"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-forest/80 via-forest/55 to-forest/90"></div>
        <div class="absolute inset-0 contour-overlay"></div>

        <div class="relative w-full h-full flex flex-col justify-center items-center text-center px-4 py-16">
            <img
            src="../img/logo_botanicare-removebg-preview.png"
            alt="Logo BotaniCare"
            class="w-28 h-28 rounded-full border-[3px] border-nude object-cover bg-cream shadow-[6px_6px_0_0_#B8863B] hover:scale-105 transition duration-300"
            />
            <h1 class="font-display text-4xl md:text-5xl text-cream mt-6 uppercase tracking-wide [text-shadow:4px_4px_0_rgba(30,51,32,0.5)]">
                BotaniCare
            </h1>

            <span class="text-nude/80 font-medium mt-2 tracking-wide">Mercado Público, Jacintinho</span>

            <div class="inline-flex items-center gap-2 bg-green-600 px-5 py-2 rounded border-2 border-cream mt-6 shadow-[4px_4px_0_0_rgba(30,51,32,0.5)]" id="date-span">
                <i class="fa fa-clock text-cream text-sm"></i>
                <span class="text-cream font-semibold text-sm">
                    Segunda à Sábado · 10:00 às 20:00
                </span>
            </div>
        </div>
    </header>
    <!-- Fim do Header -->

    <h2 class="font-serif text-3xl md:text-4xl text-center mt-16 mb-10 text-forest">
        Lista de produtos
    </h2>

<!--Início Menu (id usado pelo script.js pra delegação de clique)-->
<div id="menu">
    <main class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 mx-auto max-w-6xl px-4 md:px-6 mb-16" id="grid-produtos">
        <p class="col-span-2 text-center text-ink/60">Carregando produtos...</p>
    </main>

    <div class="hidden" id="secao-bebidas">
        <div class="mx-auto max-w-6xl px-4 md:px-6 my-2">
            <h2 class="font-serif italic text-3xl md:text-4xl font-medium text-center mt-6 mb-8 text-forest">
                Bebidas
            </h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 mx-auto max-w-6xl px-4 md:px-6 mb-16" id="grid-bebidas"></div>
    </div>
</div>
<!--Fim Menu-->

<!--Modal Cart-->
<div class="bg-forest/70 backdrop-blur-sm w-full h-full fixed top-0 left-0 z-[99] flex items-center justify-center hidden" id="cart-modal">
    <div class="bg-cream p-6 rounded-lg border-[3px] border-forest shadow-[10px_10px_0_0_#B8863B] min-w-[90%] md:min-w-[520px] md:max-w-[560px]">
    <h2 class="text-center font-serif text-2xl mb-4 text-forest">Meu Carrinho</h2>

    <div id="cart-items" class="flex justify-between mb-2 flex-col divide-y divide-sage/30"></div>

    <div class="flex gap-2 mt-3">
        <input
        type="text"
        id="cupom-input"
        placeholder="Cupom de desconto"
        class="flex-1 border-2 border-forest bg-white p-2 rounded uppercase text-sm outline-none focus:border-honey transition"
        />
        <button
        type="button"
        id="btn-aplicar-cupom"
        class="bg-moss hover:bg-honey text-cream font-serif px-4 rounded border-2 border-forest shadow-[3px_3px_0_0_#1E3320] hover:shadow-none hover:translate-x-[3px] hover:translate-y-[3px] transition text-sm"
        >Aplicar</button>
    </div>
    <p class="text-xs mt-1 min-h-[16px]" id="cupom-mensagem"></p>

    <div class="mt-3 text-sm flex flex-col gap-1">
        <div class="flex justify-between text-ink/70">
            <span>Subtotal</span>
            <span id="valor-subtotal">R$ 0,00</span>
        </div>
        <div class="flex justify-between text-honey hidden" id="linha-desconto">
            <span>Desconto</span>
            <span id="valor-desconto">- R$ 0,00</span>
        </div>
        <div class="flex justify-between text-ink/70">
            <span>Frete</span>
            <span id="valor-frete">R$ 0,00</span>
        </div>
        <p class="font-bold text-forest mt-1 flex justify-between text-base border-t-2 border-forest pt-2">
            <span>Total</span>
            <span id="cart-total">R$ 0,00</span>
        </p>
    </div>

    <p class="font-semibold mt-4 text-ink">Endereço de Entrega:</p>

    <input
    type="text"
    placeholder="Digite seu endereço completo"
    id="address"
    class="w-full border-2 border-forest bg-white p-2 rounded my-2 outline-none focus:border-honey transition"
    />

    <p class="text-red-500 hidden text-sm" id="address-warn">Digite seu endereço completo!</p>

    <p class="hidden text-sm mt-2 font-semibold" id="checkout-status"></p>

    <div class="flex items-center justify-between mt-4 w-full">
        <button id="close-modal-btn" class="text-ink/70 font-medium hover:text-forest transition">Fechar</button>
        <button id="checkout-btn" class="bg-moss hover:bg-honey text-cream font-serif px-5 py-2 rounded border-2 border-forest shadow-[3px_3px_0_0_#1E3320] hover:shadow-none hover:translate-x-[3px] hover:translate-y-[3px] transition">Finalizar Pedido</button>
    </div>
</div>
</div>
<!-- Fim Modal Cart-->

<!-- Button Footer-->
<footer class="w-full bg-forest py-3 fixed bottom-0 flex items-center justify-center shadow-[0_-6px_20px_-8px_rgba(30,51,32,0.5)]">
    <button class="flex items-center gap-2 text-cream font-semibold" id="cart-btn">
        <span class="bg-honey text-forest text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center" id="cart-count">0</span>
        Ver meu carrinho
        <i class="fa fa-cart-plus text-cream"></i>
    </button>
</footer>
 <!-- Fim Button Footer-->

 <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="produtos.js"></script>
<script src="script.js"></script>

</body>
</html>
